{{- if eq (include "kubepilot.pdb.enabled" .) "true" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubepilot.fullname" . }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "kubepilot.selectorLabels" . | nindent 6 }}
{{- end }}
