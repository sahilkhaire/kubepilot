image:
  repository: ghcr.io/sahilkhaire/k8s-apis
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 2

service:
  port: 8080

ingress:
  host: ""
  tlsSecretName: ""
  className: nginx

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

existingSecret: ""

mongodbUri: ""
sessionSecret: ""
ownerUsername: owner
ownerPassword: ""

sessionAffinity: ClientIP

podDisruptionBudget:
  enabled:  # unset = true when replicaCount >= 2

serviceAccount:
  create: true
  name: ""

nameOverride: ""
fullnameOverride: ""
