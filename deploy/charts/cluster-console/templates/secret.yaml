{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-console.fullname" . }}
  labels:
    {{- include "cluster-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ required "mongodbUri is required when existingSecret is not set" .Values.mongodbUri | quote }}
  SESSION_SECRET: {{ required "sessionSecret is required when existingSecret is not set" .Values.sessionSecret | quote }}
  OWNER_USERNAME: {{ .Values.ownerUsername | quote }}
  OWNER_PASSWORD: {{ required "ownerPassword is required when existingSecret is not set" .Values.ownerPassword | quote }}
{{- end }}
